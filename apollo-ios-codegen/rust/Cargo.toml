[workspace]
members = [
    "apollo-ios-cli",
    "codegen-cli",
    "apollo-codegen-lib",
    "graphql-compiler",
    "ir",
    "template-string",
    "template-string-macros",
    "utilities",
]
resolver = "2"

[workspace.dependencies]
indexmap = { version = "2.13", features = ["serde"] }
regex = "1.12"
bitflags = "2.11"
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
apollo-compiler = "1.31"
syn = { version = "2.0", features = ["full", "parsing", "printing"] }
quote = "1.0"
proc-macro2 = "1.0"
rayon = "1.10"
sha2 = "0.10"
globset = "0.4"
walkdir = "2.5"
prost = "0.14"
bytes = "1.11"
ctrlc = "3.5"

[workspace.lints.clippy]
disallowed_types = "deny"
