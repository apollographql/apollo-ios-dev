name: Claude Follow-up

# Responds to `@claude` mentions on issues and pull requests in this repo.
# Used to answer the questions raised by Claude Issue Triage tracking issues
# and to continue that work. See .github/claude-automation.md.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

env:
  XCODE_VERSION: "26.5"

jobs:
  followup:
    name: Respond to @claude
    if: contains(github.event.comment.body, '@claude')
    runs-on: macos-26
    timeout-minutes: 90
    concurrency:
      group: claude-followup-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: read
    steps:
      # Optional custom GitHub App with access to apollo-ios; see claude-automation.md.
      - name: Create bot token
        id: bot
        if: vars.CLAUDE_BOT_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CLAUDE_BOT_APP_ID }}
          private-key: ${{ secrets.CLAUDE_BOT_APP_PRIVATE_KEY }}
          owner: apollographql
          repositories: apollo-ios,apollo-ios-dev

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Tuist
        uses: jdx/mise-action@v4

      # Runs as the Claude GitHub App (claude[bot]). When a custom bot app is
      # configured its token is exported for gh so upstream replies can be
      # posted; an empty GH_TOKEN is ignored by gh and the App token is used.
      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        with:
          # Either credential works; leave the one you are not using unset.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_API_KEY || secrets.ANTHROPIC_API_KEY }}
          additional_permissions: |
            actions: read
          claude_args: |
            --model ${{ vars.CLAUDE_MODEL || 'claude-opus-5' }}
            --max-turns 150
            --append-system-prompt "Before doing anything else, read .github/claude/followup-instructions.md and follow it."
            --allowedTools "Read,Glob,Grep,Edit,MultiEdit,Write,Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue comment:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr create:*),Bash(gh pr checks:*),Bash(gh search:*),Bash(gh api repos/apollographql/:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(git grep:*),Bash(git fetch:*),Bash(git checkout:*),Bash(git switch:*),Bash(git branch:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git restore:*),Bash(swift build:*),Bash(swift test:*),Bash(swift package:*),Bash(tuist generate:*),Bash(xcodebuild:*),Bash(xcrun:*),Bash(ls:*),Bash(cat:*),Bash(find:*),Bash(grep:*),Bash(rg:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(jq:*),Bash(mkdir:*),Bash(npm test:*),Bash(npm install:*)"
