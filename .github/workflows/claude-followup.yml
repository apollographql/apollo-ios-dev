name: Claude Follow-up

# Responds to `@claude` mentions from maintainers on pull requests in this repo.
# Used to answer the questions raised by Claude Issue Triage tracking PRs and to
# continue that work. See .github/claude-automation.md.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

env:
  XCODE_VERSION: "26.5"

jobs:
  followup:
    name: Respond to @claude
    # The action also verifies write permission; this gate stops the macOS
    # runner from being booted at all for comments by people without it.
    if: >-
      contains(github.event.comment.body, '@claude') &&
      contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: macos-26
    timeout-minutes: 90
    concurrency:
      group: claude-followup-${{ github.event.issue.number || github.event.pull_request.number }}-${{ github.event.comment.id }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: read
    steps:
      # When the bot app is configured it is passed as github_token so Claude's
      # gh calls (including upstream replies) run as that bot. The action
      # overwrites GH_TOKEN in Claude's environment, so an env var would not do.
      - name: Create bot token
        id: bot
        if: vars.CLAUDE_BOT_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CLAUDE_BOT_APP_ID }}
          private-key: ${{ secrets.CLAUDE_BOT_APP_PRIVATE_KEY }}
          owner: apollographql
          repositories: apollo-ios,apollo-ios-dev

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Tuist
        uses: jdx/mise-action@v4

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          # Either credential works; leave the one you are not using unset.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_API_KEY || secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.bot.outputs.token }}
          additional_permissions: |
            actions: read
          claude_args: |
            --model ${{ vars.CLAUDE_MODEL || 'claude-opus-5' }}
            --max-turns 150
            --append-system-prompt "Before doing anything else, read .github/claude/followup-instructions.md and follow it. UPSTREAM_POSTING_ENABLED=${{ steps.bot.outputs.token != '' }}"
            --allowedTools "Read,Glob,Grep,Edit,MultiEdit,Write,Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue comment:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr create:*),Bash(gh pr ready:*),Bash(gh pr edit:*),Bash(gh pr close:*),Bash(gh pr comment:*),Bash(gh run view:*),Bash(gh search:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(git grep:*),Bash(git fetch:*),Bash(git checkout:*),Bash(git switch:*),Bash(git branch:*),Bash(git add:*),Bash(git commit:*),Bash(git push origin:*),Bash(git restore:*),Bash(swift build:*),Bash(swift test:*),Bash(tuist generate:*),Bash(xcodebuild:*),Bash(ls:*),Bash(cat:*),Bash(find:*),Bash(grep:*),Bash(rg:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(jq:*),Bash(mkdir:*)"
            --disallowedTools "Bash(gh api:*),Bash(gh pr merge:*),Bash(gh repo:*),Bash(git push --force:*),Bash(git push -f:*),Bash(git push origin --force:*),Bash(git push origin -f:*),Bash(npm:*),Bash(npx:*),Bash(curl:*),Bash(swift package:*),Bash(xcrun:*),WebFetch,WebSearch"
